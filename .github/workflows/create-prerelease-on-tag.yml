name: Create prerelease on tag
on:
  push:
    tags:
      - "*.*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the Chrome manifest and release tag (e.g. 26.11.26.0)"
        required: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: "package.json"

      # intentionally do not use cache to keep the build more comprehensible and sandboxed
      - name: Install dependencies
        run: npm ci

      - uses: ./.github/actions/build-wasm
        with:
          cache: "false"

      - name: Build Legal
        run: npm run license-report:html

      - name: Determine version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
          else
            minutes=$((10#$(date -u +'%H') * 60 + 10#$(date -u +'%M')))
            version="$(date -u +'%y.%-m.%-d').${minutes}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build Chrome
        run: npm run-script build -- --version "${{ steps.version.outputs.version }}" chrome chrome-dev
        shell: bash

      - name: Generate hashes
        id: hash
        run: |
          cd builds
          echo "hashes=$(sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Release
        id: release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # pin@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: true
          files: builds/*

  provenance:
    if: github.ref_type == 'tag'
    needs: [build]
    permissions:
      actions: read # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
